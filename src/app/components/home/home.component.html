<mat-card class="home-card">
  <mat-card-content>
    <div class="intro">
      <h1>ברוכים הבאים לשירותי עיריית חריש</h1>
      <p>בשלב זה זמין ביישום רק השירות של הנחה בארנונה. כאן תוכלו להתחיל את הבקשה באופן מקוון בצורה ברורה וממוקדת.</p>
    </div>

    <div class="action-panel">
      <div class="service-hero">
        <mat-icon class="service-icon">local_atm</mat-icon>
        <div class="service-text">
          <div class="service-title">הנחה בארנונה</div>
          <div class="service-description">הגש בקשה לקבלת הנחה בארנונה בקלות ובמהירות. השירות זמין ומעודכן.</div>
        </div>
      </div>

      <a href="/application" class="primary-button">המשך לבקשה</a>
    </div>
  </mat-card-content>
</mat-card>
