<mat-card class="news-card">
  <mat-card-content>
    <div class="news-date">{{date}}</div>
    <h3 class="news-card-title">{{title}}</h3>
    <p class="news-summary">{{summary}}</p>
  </mat-card-content>
  <mat-card-actions class="news-card-actions">
    <a href="#" class="read-more-link">קרא עוד</a>
  </mat-card-actions>
</mat-card>
